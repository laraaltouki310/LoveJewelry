<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>شاشة منبثقة</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
    }

    /* زر الفتح */
    .open-btn {
      padding: 10px 20px;
      background-color: #f06292;
      color: white;
      border: none;
      cursor: pointer;
      margin: 20px;
    }

    /* الخلفية المعتمة */
    .modal {
      display: none;              /* مخفية افتراضياً */
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.6); /* خلفية شفافة */
      z-index: 9999;
    }

    /* محتوى النافذة */
    .modal-content {
      background-color: white;
      margin: 10% auto;
      padding: 20px;
      width: 80%;
      max-width: 400px;
      border-radius: 8px;
      text-align: center;
    }

    /* زر الإغلاق */
    .close-btn {
      background-color: #ec407a;
      color: white;
      border: none;
      padding: 8px 16px;
      cursor: pointer;
      margin-top: 15px;
    }
  </style>
</head>
<body>


  <!-- النافذة المنبثقة -->
  <div id="myModal" class="modal">
    <div class="modal-content">
      <h2>مرحبا 👋</h2>
      <p>هاي شاشة منبثقة فوق الصفحة.</p>
      <button class="close-btn" onclick="closeModal()">إغلاق</button>
    </div>
  </div>

  <script>
    function openModal() {
      document.getElementById("myModal").style.display = "block";
    }
    function closeModal() {
      document.getElementById("myModal").style.display = "none";
    }
  </script>

</body>
</html>
